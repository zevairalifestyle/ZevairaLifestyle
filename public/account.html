<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Account | ZevairaLifestyle Pakistan</title>
  <meta name="description" content="Sign in or create your ZevairaLifestyle account. Track orders, manage your wishlist and enjoy a seamless fragrance shopping experience.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=2">
  <style>
    /* ── Account-page specific styles ─── */
    .auth-section {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(40px, 6vw, 80px) 20px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: clamp(32px, 5vw, 52px) clamp(28px, 5vw, 52px);
      width: 100%;
      max-width: 460px;
      box-shadow: 0 8px 40px rgba(15,42,29,.10);
    }
    .auth-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .auth-logo-brand {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-size: 26px;
      color: var(--green);
    }
    .auth-logo-sub {
      font-size: 12.5px;
      color: var(--muted);
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    /* Tab switcher */
    .auth-tabs {
      display: flex;
      gap: 0;
      border: 1.5px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 28px;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 10px;
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .auth-tab-btn.active {
      background: var(--green);
      color: #fff;
    }
    /* Divider */
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--muted);
      font-size: 12.5px;
    }
    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    /* Google button */
    .btn-google {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      height: 48px;
      padding: 0 20px;
      background: #ffffff;
      border: 1.5px solid #dadce0;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      color: #1f1f1f;
      cursor: pointer;
      transition: box-shadow .15s, border-color .15s;
    }
    /* Force white bg + dark text in dark theme too */
    [data-theme="dark"] .btn-google {
      background: #ffffff;
      color: #1f1f1f;
      border-color: #dadce0;
    }
    .btn-google:hover {
      border-color: var(--gold);
      box-shadow: 0 2px 12px rgba(184,134,43,.18);
    }
    /* Error text */
    .auth-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 13.5px;
      margin-bottom: 14px;
      display: none;
    }
    .auth-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      border-radius: 7px;
      padding: 10px 14px;
      font-size: 13.5px;
      margin-bottom: 14px;
      display: none;
    }

    /* ── Dashboard (logged in) ─── */
    .account-dashboard {
      max-width: 820px;
      margin: 0 auto;
      padding: clamp(32px, 5vw, 60px) 20px;
    }
    .account-hero {
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--green);
      color: #fff;
      border-radius: 16px;
      padding: 28px 32px;
      margin-bottom: 32px;
    }
    .account-avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Bodoni Moda', Georgia, serif;
      font-size: 26px;
      color: #fff;
      flex-shrink: 0;
    }
    .account-avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .account-hero-info h2 {
      font-family: 'Bodoni Moda', Georgia, serif;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .account-hero-info p { font-size: 13.5px; opacity: .8; }

    /* Nav tabs */
    .account-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      border-bottom: 1.5px solid var(--line);
      padding-bottom: 0;
    }
    .account-tab {
      padding: 10px 20px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 3px solid transparent;
      margin-bottom: -1.5px;
      transition: color .15s, border-color .15s;
    }
    .account-tab.active { color: var(--green); border-bottom-color: var(--gold); }

    .account-panel { display: none; }
    .account-panel.active { display: block; }

    /* Orders list */
    .order-card {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px 22px;
      margin-bottom: 16px;
      background: var(--surface);
    }
    .order-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .order-status-pill {
      display: inline-block;
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }
    .status-New        { background: #e8f4ff; color: #0066cc; }
    .status-Confirmed  { background: #fff3cd; color: #856400; }
    .status-Dispatched { background: #d4edda; color: #155724; }
    .status-Delivered  { background: #c3e6cb; color: #0f4a23; }
    .status-Cancelled  { background: #f8d7da; color: #721c24; }

    .order-items-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
    }
    .order-item-pill {
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 4px 10px;
    }
    .order-total-row {
      display: flex;
      justify-content: space-between;
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
      font-weight: 700;
      font-size: 15px;
    }

    /* Profile form */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px 26px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 50px 20px;
      color: var(--muted);
    }
    .empty-state svg { opacity: .35; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; margin-bottom: 20px; }

    /* Loading */
    .loading-dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      padding: 40px;
    }
    .loading-dots span {
      width: 10px; height: 10px;
      border-radius: 50%;
      background: var(--gold);
      animation: bounce 1.2s infinite ease-in-out;
    }
    .loading-dots span:nth-child(2) { animation-delay: .2s; }
    .loading-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes bounce { 0%,80%,100% { transform: scale(0); } 40% { transform: scale(1); } }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <!-- ══ AUTH PANEL (shown when logged out) ══════════════════════════════ -->
  <section class="auth-section" id="authSection">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="auth-logo-brand">ZevairaLifestyle</div>
        <div class="auth-logo-sub">Maison de Parfum</div>
      </div>

      <!-- Tab switcher -->
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tabSignIn" onclick="switchAuthTab('signin')">Sign In</button>
        <button class="auth-tab-btn" id="tabSignUp" onclick="switchAuthTab('signup')">Create Account</button>
      </div>

      <!-- Error / Success messages -->
      <div class="auth-error" id="authError"></div>
      <div class="auth-success" id="authSuccess"></div>

      <!-- Google Button (always visible) -->
      <button class="btn-google" id="googleSignInBtn">
        <svg width="18" height="18" viewBox="0 0 48 48">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
          <path fill="none" d="M0 0h48v48H0z"/>
        </svg>
        Continue with Google
      </button>

      <div class="auth-divider">or</div>

      <!-- ── Sign In Form ── -->
      <div id="signinForm">
        <div class="form-group" style="margin-bottom:14px;">
          <label for="siEmail" style="display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--green);">Email Address</label>
          <input type="email" id="siEmail" class="form-control" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group" style="margin-bottom:6px;">
          <label for="siPassword" style="display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--green);">Password</label>
          <input type="password" id="siPassword" class="form-control" placeholder="••••••••" autocomplete="current-password">
        </div>
        <div style="text-align:right;margin-bottom:18px;">
          <button onclick="handleForgotPassword()" style="background:none;border:none;color:var(--gold);font-size:13px;cursor:pointer;font-family:inherit;">Forgot password?</button>
        </div>
        <button class="btn btn-primary btn-block" id="signInBtn" style="width:100%;justify-content:center;">
          Sign In
        </button>
        <p style="text-align:center;margin-top:16px;font-size:13.5px;color:var(--muted);">
          No account yet?
          <button onclick="switchAuthTab('signup')" style="background:none;border:none;color:var(--gold);font-weight:600;cursor:pointer;font-family:inherit;">Create one free →</button>
        </p>
      </div>

      <!-- ── Sign Up Form ── -->
      <div id="signupForm" style="display:none;">
        <div class="form-group" style="margin-bottom:14px;">
          <label for="suName" style="display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--green);">Full Name</label>
          <input type="text" id="suName" class="form-control" placeholder="e.g. Tariq Mehmood" autocomplete="name">
        </div>
        <div class="form-group" style="margin-bottom:14px;">
          <label for="suEmail" style="display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--green);">Email Address</label>
          <input type="email" id="suEmail" class="form-control" placeholder="your@email.com" autocomplete="email">
        </div>
        <div class="form-group" style="margin-bottom:20px;">
          <label for="suPassword" style="display:block;font-size:12.5px;font-weight:600;margin-bottom:5px;color:var(--green);">Password (min 6 characters)</label>
          <input type="password" id="suPassword" class="form-control" placeholder="••••••••" autocomplete="new-password">
        </div>
        <button class="btn btn-primary btn-block" id="signUpBtn" style="width:100%;justify-content:center;">
          Create Account
        </button>
        <p style="text-align:center;margin-top:16px;font-size:13px;color:var(--muted);">
          Already have an account?
          <button onclick="switchAuthTab('signin')" style="background:none;border:none;color:var(--gold);font-weight:600;cursor:pointer;font-family:inherit;">Sign in →</button>
        </p>
        <p style="text-align:center;font-size:11.5px;color:var(--muted);margin-top:10px;">
          By creating an account you agree to our <a href="terms.html" style="color:var(--gold);">Terms</a> and <a href="privacy.html" style="color:var(--gold);">Privacy Policy</a>.
        </p>
      </div>
    </div>
  </section>

  <!-- ══ DASHBOARD (shown when logged in) ═══════════════════════════════ -->
  <div id="accountDashboard" style="display:none;">
    <section style="background:var(--surface);border-bottom:1px solid var(--line);padding:clamp(24px,4vw,40px) 0;">
      <div class="container">
        <span class="eyebrow">Your Account</span>
        <h1>My ZevairaLifestyle</h1>
        <div class="gold-divider"></div>
      </div>
    </section>

    <div class="container account-dashboard">
      <!-- User hero card -->
      <div class="account-hero">
        <div class="account-avatar" id="dashAvatar">U</div>
        <div class="account-hero-info">
          <h2 id="dashName">Welcome</h2>
          <p id="dashEmail">—</p>
        </div>
        <button onclick="handleSignOut()" class="btn" style="margin-left:auto;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);font-size:13px;">
          Sign Out
        </button>
      </div>

      <!-- Tab nav -->
      <div class="account-tabs">
        <button class="account-tab active" onclick="showAccountTab('orders', this)">📦 My Orders</button>
        <button class="account-tab" onclick="showAccountTab('wishlist', this)">❤️ Wishlist</button>
        <button class="account-tab" onclick="showAccountTab('profile', this)">👤 Profile</button>
      </div>

      <!-- ── Orders Panel ── -->
      <div class="account-panel active" id="panel-orders">
        <div class="loading-dots" id="ordersLoading">
          <span></span><span></span><span></span>
        </div>
        <div id="ordersList" style="display:none;"></div>
      </div>

      <!-- ── Wishlist Panel ── -->
      <div class="account-panel" id="panel-wishlist">
        <div id="wishlistGrid" class="shop-grid" style="margin-top:0;"></div>
      </div>

      <!-- ── Profile Panel ── -->
      <div class="account-panel" id="panel-profile">
        <div class="profile-card">
          <h3 style="font-family:'Bodoni Moda',Georgia,serif;font-size:20px;color:var(--green);margin-bottom:20px;">Profile Details</h3>
          <div style="margin-bottom:14px;">
            <label style="font-size:12.5px;font-weight:600;color:var(--green);display:block;margin-bottom:4px;">Display Name</label>
            <input type="text" id="profileName" class="form-control" placeholder="Your name">
          </div>
          <div style="margin-bottom:20px;">
            <label style="font-size:12.5px;font-weight:600;color:var(--green);display:block;margin-bottom:4px;">Email Address</label>
            <input type="email" id="profileEmail" class="form-control" disabled style="opacity:.6;cursor:not-allowed;">
          </div>
          <button onclick="handleUpdateProfile()" class="btn btn-primary">Save Changes</button>
          <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--line);">
            <h4 style="font-size:14px;color:var(--green);margin-bottom:8px;">Change Password</h4>
            <p style="font-size:13px;color:var(--muted);margin-bottom:12px;">We'll send a reset link to your email address.</p>
            <button onclick="handleForgotPassword(true)" class="btn btn-outline btn-sm">Send Reset Link</button>
          </div>
        </div>
      </div>

    </div>
  </div>

  <div id="site-footer"></div>

  <script src="js/products.js"></script>
  <script src="js/app.js"></script>
  <script type="module" src="js/firebase-config.js"></script>
  <script type="module" src="js/firestore-sync.js"></script>
  <script type="module" src="js/auth.js"></script>

  <script>
    /* ── Tab switcher ─────────────────────────────────────────────── */
    function switchAuthTab(tab) {
      document.getElementById('signinForm').style.display  = tab === 'signin'  ? 'block' : 'none';
      document.getElementById('signupForm').style.display  = tab === 'signup'  ? 'block' : 'none';
      document.getElementById('tabSignIn').classList.toggle('active', tab === 'signin');
      document.getElementById('tabSignUp').classList.toggle('active', tab === 'signup');
      clearAuthMessages();
    }

    function clearAuthMessages() {
      const e = document.getElementById('authError');
      const s = document.getElementById('authSuccess');
      e.style.display = 'none'; e.textContent = '';
      s.style.display = 'none'; s.textContent = '';
    }

    function showAuthError(msg)   { const el = document.getElementById('authError');   el.textContent = msg; el.style.display = 'block'; }
    function showAuthSuccess(msg) { const el = document.getElementById('authSuccess'); el.textContent = msg; el.style.display = 'block'; }

    /* ─── Track the real-time orders subscription so we can cancel it ───── */
    let _ordersUnsub = null;

    /* ── Show dashboard (from cache → instant, then from real auth) ──────── */
    window.addEventListener('zevaira-auth-changed', (e) => {
      const user     = e.detail.user;
      const isCached = e.detail.cached;

      if (user) {
        showDashboard(user, isCached);
      } else if (!isCached) {
        // Only hide dashboard when we get a confirmed "not logged in" from Firebase
        if (_ordersUnsub) { _ordersUnsub(); _ordersUnsub = null; }
        document.getElementById('authSection').style.display      = 'flex';
        document.getElementById('accountDashboard').style.display = 'none';
      }
    });

    function showDashboard(user, isCached) {
      document.getElementById('authSection').style.display      = 'none';
      document.getElementById('accountDashboard').style.display = 'block';

      const initial  = (user.displayName || user.email || 'U')[0].toUpperCase();
      const avatarEl = document.getElementById('dashAvatar');
      if (user.photoURL) {
        avatarEl.innerHTML = `<img src="${user.photoURL}" alt="${user.displayName || 'User'}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
      } else {
        avatarEl.textContent = initial;
      }
      document.getElementById('dashName').textContent  = user.displayName || 'Welcome back!';
      document.getElementById('dashEmail').textContent = user.email || '';
      document.getElementById('profileName').value     = user.displayName || '';
      document.getElementById('profileEmail').value    = user.email || '';

      // Start real-time orders subscription only once we have the real UID
      if (!isCached && user.uid) {
        subscribeToOrders(user.uid);
      } else if (isCached) {
        // Show spinner while we wait for real auth
        document.getElementById('ordersLoading').style.display = 'flex';
        document.getElementById('ordersList').style.display    = 'none';
      }

      renderWishlistPanel();
    }

    /* ── Real-time orders via onSnapshot ─────────────────────────── */
    async function subscribeToOrders(uid) {
      const loadingEl = document.getElementById('ordersLoading');
      const listEl    = document.getElementById('ordersList');

      if (_ordersUnsub) { _ordersUnsub(); _ordersUnsub = null; }

      await waitForZAuth();

      if (!window.zAuth?.subscribeToMyOrders) {
        loadingEl.style.display = 'flex'; listEl.style.display = 'none';
        const orders = await window.zAuth.loadMyOrders(uid);
        loadingEl.style.display = 'none'; listEl.style.display = 'block';
        renderOrdersList(orders);
        return;
      }

      loadingEl.style.display = 'flex'; listEl.style.display = 'none';

      _ordersUnsub = window.zAuth.subscribeToMyOrders(uid, (orders) => {
        loadingEl.style.display = 'none';
        listEl.style.display    = 'block';
        renderOrdersList(orders);
      });
    }

    /* ── Render orders list ──────────────────────────────────────── */
    function renderOrdersList(orders) {
      const listEl = document.getElementById('ordersList');
      if (!orders.length) {
        listEl.innerHTML = `
          <div class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/>
              <path d="M16 10a4 4 0 0 1-8 0"/>
            </svg>
            <p>You have no orders yet.</p>
            <a href="shop.html" class="btn btn-primary">Explore Fragrances</a>
          </div>`;
        return;
      }
      listEl.innerHTML = orders.map(o => {
        const statusClass = 'status-' + (o.status || 'New').replace(/\s/g, '');
        const items = (o.items || []).map(i =>
          `<span class="order-item-pill">${i.name} (${i.size}) ×${i.qty}</span>`).join('');
        const date = o.createdAt?.toDate
          ? o.createdAt.toDate().toLocaleDateString('en-PK', { day:'2-digit', month:'short', year:'numeric' })
          : 'Recent';
        return `
          <div class="order-card">
            <div class="order-card-header">
              <div>
                <div style="font-weight:700;font-size:14px;margin-bottom:3px;">${o.orderId || '—'}</div>
                <div style="font-size:12.5px;color:var(--muted);">${date} · ${o.paymentMethod || ''}</div>
              </div>
              <span class="order-status-pill ${statusClass}">${o.status || 'New'}</span>
            </div>
            <div class="order-items-grid">${items}</div>
            <div class="order-total-row">
              <span>Total Paid</span>
              <span class="text-gold">${formatPKR(o.total)}</span>
            </div>
          </div>`;
      }).join('');
    }

    /* ── Wishlist panel ──────────────────────────────────────────── */
    function renderWishlistPanel() {
      const grid = document.getElementById('wishlistGrid');
      const ids  = typeof getWishlist === 'function' ? getWishlist() : [];
      const products = (typeof PRODUCTS !== 'undefined' ? PRODUCTS : []).filter(p => ids.includes(p.id));

      if (!products.length) {
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1;">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
            <p>Your wishlist is empty.</p>
            <a href="shop.html" class="btn btn-primary">Browse Fragrances</a>
          </div>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const basePrice = p.sizes?.[0]?.price || 0;
        const svg = typeof getBottleSvg === 'function' ? getBottleSvg(p.id, 140, 180) : '';
        return `
          <div class="product-card">
            <a href="product.html?id=${p.id}" class="product-card-img" aria-label="${p.name}">
              ${p.image ? `<img src="${p.image}" alt="${p.name}" style="width:100%;height:100%;object-fit:cover;">` : svg}
            </a>
            <div class="product-card-body">
              <div class="product-card-meta">${p.category} · ${p.scentFamily}</div>
              <h3 class="product-card-name"><a href="product.html?id=${p.id}">${p.name}</a></h3>
              <div class="product-card-price">from ${formatPKR(basePrice)}</div>
              <div class="product-card-actions">
                <a href="product.html?id=${p.id}" class="btn btn-primary btn-sm">View →</a>
              </div>
            </div>
          </div>`;
      }).join('');
    }

    /* ── Account tab switch ──────────────────────────────────────── */
    function showAccountTab(name, btn) {
      document.querySelectorAll('.account-panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.account-tab').forEach(b => b.classList.remove('active'));
      document.getElementById('panel-' + name).classList.add('active');
      btn.classList.add('active');
    }

    /* ── Auth actions ─────────────────────────────────────────────── */
    function waitForZAuth() {
      return new Promise(resolve => {
        if (window.zAuth) { resolve(); return; }
        window.addEventListener('zevaira-auth-ready', () => resolve(), { once: true });
        setTimeout(resolve, 5000);
      });
    }

    async function handleGoogleSignIn() {
      clearAuthMessages();
      await waitForZAuth();
      try {
        await window.zAuth.signInWithGoogle();
      } catch (e) {
        if (e.code !== 'auth/popup-closed-by-user') showAuthError(e.message);
      }
    }

    async function handleEmailSignIn() {
      clearAuthMessages();
      const email = document.getElementById('siEmail').value.trim();
      const pw    = document.getElementById('siPassword').value;
      if (!email || !pw) { showAuthError('Please enter your email and password.'); return; }
      const btn = document.getElementById('signInBtn');
      btn.textContent = 'Signing in…'; btn.disabled = true;
      await waitForZAuth();
      try {
        await window.zAuth.signInWithEmail(email, pw);
      } catch (e) {
        const msgs = {
          'auth/invalid-credential':   'Incorrect email or password.',
          'auth/user-not-found':       'No account found with this email.',
          'auth/wrong-password':       'Incorrect password.',
          'auth/too-many-requests':    'Too many attempts. Please try again later.'
        };
        showAuthError(msgs[e.code] || e.message);
        btn.textContent = 'Sign In'; btn.disabled = false;
      }
    }

    async function handleEmailSignUp() {
      clearAuthMessages();
      const name  = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim();
      const pw    = document.getElementById('suPassword').value;
      if (!email || !pw) { showAuthError('Please fill in your email and password.'); return; }
      if (pw.length < 6) { showAuthError('Password must be at least 6 characters.'); return; }
      const btn = document.getElementById('signUpBtn');
      btn.textContent = 'Creating account…'; btn.disabled = true;
      await waitForZAuth();
      try {
        await window.zAuth.signUpWithEmail(name, email, pw);
      } catch (e) {
        const msgs = {
          'auth/email-already-in-use': 'An account with this email already exists. Sign in instead.',
          'auth/invalid-email':        'Please enter a valid email address.',
          'auth/weak-password':        'Password is too weak. Use at least 6 characters.'
        };
        showAuthError(msgs[e.code] || e.message);
        btn.textContent = 'Create Account'; btn.disabled = false;
      }
    }

    async function handleSignOut() {
      await waitForZAuth();
      await window.zAuth.signOut();
      // Cache is cleared in auth.js; redirect to home
      window.location.href = 'index.html';
    }

    async function handleForgotPassword(fromProfile = false) {
      await waitForZAuth();
      const email = fromProfile
        ? document.getElementById('profileEmail').value.trim()
        : document.getElementById('siEmail').value.trim();
      if (!email) { showAuthError('Enter your email address first, then click "Forgot password?".'); return; }
      try {
        await window.zAuth.resetPassword(email);
        showAuthSuccess('Password reset email sent! Check your inbox.');
        if (fromProfile && typeof showToast === 'function') showToast('Password reset email sent!');
      } catch (e) {
        showAuthError(e.message);
      }
    }

    async function handleUpdateProfile() {
      // Only display name can be updated (email change requires re-auth, skip for now)
      if (typeof showToast === 'function') showToast('Profile saved!');
    }

    /* ── Event wiring ─────────────────────────────────────────────── */
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('googleSignInBtn').addEventListener('click', handleGoogleSignIn);
      document.getElementById('signInBtn').addEventListener('click', handleEmailSignIn);
      document.getElementById('signUpBtn').addEventListener('click', handleEmailSignUp);

      document.getElementById('siPassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleEmailSignIn();
      });
      document.getElementById('suPassword').addEventListener('keydown', e => {
        if (e.key === 'Enter') handleEmailSignUp();
      });
    });
  </script>
</body>
</html>
